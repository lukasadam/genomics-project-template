[project]
name = "{{ project_slug }}"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
authors = [{name = "{{ author_name }}", email = "{{ author_email }}"}]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 99
src = ["src"]
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
